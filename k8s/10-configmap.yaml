apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: incident-journal
  labels:
    app.kubernetes.io/part-of: incident-journal
data:
  # Параметри конфігурації застосунку (підключаються як змінні оточення)
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  DEFAULT_EVENT_LEVEL: "info"
  CORE_TIMEOUT: "3.0"
  DB_HOST: "postgres"
  DB_PORT: "5432"
