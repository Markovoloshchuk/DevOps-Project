apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: incident-journal
  labels:
    app.kubernetes.io/part-of: incident-journal
    app.kubernetes.io/name: core-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: core-service
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: incident-journal
        app.kubernetes.io/name: core-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: core-service
          image: ghcr.io/markovoloshchuk/core_service:1.0.0
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_NAME
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
