apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: incident-journal
  labels:
    app.kubernetes.io/part-of: incident-journal
type: Opaque
stringData:
  # Чутливі параметри підключення до БД.
  # Значення — умовні, навчальні (не реальні паролі робочих систем).
  DB_USER: "app"
  DB_PASSWORD: "lab-only-password"
  DB_NAME: "events_db"
  POSTGRES_PASSWORD: "lab-only-password"
