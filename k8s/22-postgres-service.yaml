apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: incident-journal
  labels:
    app.kubernetes.io/part-of: incident-journal
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
