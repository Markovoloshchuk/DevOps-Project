apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: incident-journal
  labels:
    app.kubernetes.io/part-of: incident-journal
    app.kubernetes.io/name: analytics-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-service
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: incident-journal
        app.kubernetes.io/name: analytics-service
        app.kubernetes.io/component: analytics
    spec:
      containers:
        - name: analytics-service
          image: ghcr.io/markovoloshchuk/analytics_service:1.0.0
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: CORE_SERVICE_URL
              value: "http://core-service:8000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
