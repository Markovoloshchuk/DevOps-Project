
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Markovoloshchuk/DevOps-Project.git
    targetRevision: lab5/gitops-argocd
    path: argocd-apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
