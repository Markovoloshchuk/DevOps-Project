apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  type: {{ .Values.postgresql.service.type }}
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: postgres
      name: postgres