apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/name: analytics-service
spec:
  replicas: {{ .Values.analyticsService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: analytics-service
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        app.kubernetes.io/name: analytics-service
        app.kubernetes.io/component: analytics
    spec:
      containers:
        - name: analytics-service
          image: "{{ .Values.analyticsService.image.repository }}:{{ .Values.analyticsService.image.tag }}"
          imagePullPolicy: {{ .Values.analyticsService.image.pullPolicy }}
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: CORE_SERVICE_URL
              value: "http://core-service:8000"
          resources:
            {{- toYaml .Values.analyticsService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5