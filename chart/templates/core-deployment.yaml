apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/name: core-service
spec:
  replicas: {{ .Values.coreService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: core-service
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
        app.kubernetes.io/name: core-service
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: core-service
          image: "{{ .Values.coreService.image.repository }}:{{ .Values.coreService.image.tag }}"
          imagePullPolicy: {{ .Values.coreService.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_NAME
          resources:
            {{- toYaml .Values.coreService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5