apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.configMap.appEnv | quote }}
  LOG_LEVEL: {{ .Values.configMap.logLevel | quote }}
  DEFAULT_EVENT_LEVEL: {{ .Values.configMap.defaultEventLevel | quote }}
  CORE_TIMEOUT: {{ .Values.configMap.coreTimeout | quote }}
  DB_HOST: "postgres"
  DB_PORT: "5432"